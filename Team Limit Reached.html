<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team — Seat limit reached · Fleetly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --side-bg:#f4f4f5; --canvas:#fff; --bg:#fff; --ink:#15171a; --ink-2:#4a4f57;
    --muted:#8a9099; --muted-2:#b6bcc4; --line:#e8e8ea; --line-2:#ededef;
    --hover:#ebebed; --active:#e0e0e3; --field:#fff; --field-bg:#fafafa;
    --brand:#ef3a3a; --brand-tint:#fde8e8; --brand-tint-2:#fbe7e7;
    --ok:#1f8a5b; --ok-tint:#e7f4ee; --warn:#c97c0d; --warn-tint:#fdf2e0;
    --info:#2f6feb; --info-tint:#e6efff;
    --t-fast:140ms cubic-bezier(.2,.7,.2,1); --t-med:220ms cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#e8e8ea}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer;padding:0}
  a{text-decoration:none;color:inherit}

  /* ============ MINI APP CHROME — shared across artboards ============ */
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100%;background:var(--canvas)}
  .side{border-right:1px solid var(--line);background:var(--side-bg);display:flex;flex-direction:column;overflow:hidden}
  .side-top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
  .logo{display:inline-flex;align-items:center;gap:8px;color:var(--brand);height:32px;padding:0 6px;border-radius:8px}
  .logo-mark{width:22px;height:22px}
  .logo-word{font-weight:700;font-size:14px;letter-spacing:-.01em;color:var(--ink)}
  .top-buttons{display:flex;gap:2px}
  .toggle{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:6px;color:var(--muted)}
  .nav{flex:1;padding:4px 8px 8px;overflow:hidden}
  .nav-section{margin-bottom:8px}
  .nav-section-label{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-2);padding:12px 10px 4px}
  .nav-item{display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;margin:1px 0;border-radius:7px;color:var(--ink-2);font-weight:500;font-size:13px}
  .nav-item .icon{width:16px;height:16px;color:var(--muted)}
  .nav-item.is-active{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,18,22,.05)}
  .nav-item.is-active .icon{color:var(--ink)}
  .side-foot{padding:6px 8px 10px;border-top:1px solid var(--line-2)}

  .top{background:var(--canvas);border-bottom:1px solid var(--line);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
  .crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .crumb-home{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line)}
  .crumb-sep{color:var(--muted-2)}
  .crumb a{color:var(--muted)}
  .crumb-cur{color:var(--ink);font-weight:500}
  .top-actions{display:flex;align-items:center;gap:10px}
  .icon-btn{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
  .avatar{width:30px;height:30px;border-radius:999px;background:#8a9099;color:#fff;display:grid;place-items:center;font-weight:600;font-size:11px}

  .btn{height:34px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;border:1px solid var(--line);color:var(--ink);background:var(--canvas);transition:all var(--t-fast);white-space:nowrap;cursor:pointer}
  .btn:hover{background:var(--hover)}
  .btn-ghost{border:0;background:transparent;color:var(--muted)}
  .btn-ghost:hover{color:var(--ink);background:var(--hover)}
  .btn-primary{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
  .btn-primary:hover{background:#2a2d33}
  .btn-brand{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn-brand:hover{background:#d62f2f}
  .btn-lg{height:42px;padding:0 18px;font-size:13.5px;border-radius:10px}
  .btn-disabled{opacity:.55;cursor:not-allowed;background:var(--canvas);color:var(--ink-2);border-color:var(--line);position:relative}
  .btn-disabled:hover{background:var(--canvas)}

  .page{padding:24px 28px 60px}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap}
  .page-eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);margin-bottom:4px}
  .page-title{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
  .page-sub{color:var(--muted);font-size:13px;margin:6px 0 0}
  .page-sub b.warn{color:var(--brand);font-weight:600}
  .head-actions{display:flex;gap:8px;align-items:center}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .kpi{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--canvas);position:relative;overflow:hidden}
  .kpi-label{font-size:11.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .kpi-label .dot{width:8px;height:8px;border-radius:99px}
  .kpi-val{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi-val .of{font-size:14px;color:var(--muted);font-weight:500}
  .kpi-trend{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
  .kpi-trend.warn{color:var(--brand)}
  .kpi.is-limit{border-color:color-mix(in srgb,var(--brand) 35%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 4%,var(--canvas)),var(--canvas))}
  .kpi .seat-bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--line-2)}
  .kpi .seat-bar > i{display:block;height:100%;background:var(--brand)}

  .tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tab{height:36px;padding:0 14px;font-size:13px;font-weight:600;color:var(--muted);position:relative;display:flex;align-items:center;gap:6px}
  .tab.is-on{color:var(--ink)}
  .tab.is-on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--ink);border-radius:2px}
  .tab .count{font-size:11px;font-weight:600;background:var(--field-bg);color:var(--muted);padding:1px 6px;border-radius:99px;border:1px solid var(--line-2)}
  .tab.is-on .count{background:var(--ink);color:var(--canvas);border-color:var(--ink)}

  .filterbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
  .search{position:relative;flex:1;min-width:240px;max-width:380px}
  .search input{width:100%;height:34px;padding:0 12px 0 32px;background:var(--field);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:13px;outline:none}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .chip-select{height:34px;padding:0 10px;border:1px solid var(--line);background:var(--canvas);border-radius:8px;font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
  .chip-select .v{color:var(--ink);font-weight:600}
  .filterbar .spacer{flex:1}

  .table-wrap{border:1px solid var(--line);border-radius:12px;background:var(--canvas);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:12px 18px;border-bottom:1px solid var(--line)}
  tbody td{padding:14px 18px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  .user-cell{display:flex;align-items:center;gap:12px}
  .uav{width:32px;height:32px;border-radius:999px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;flex:0 0 32px}
  .uname{font-weight:600;color:var(--ink);font-size:13px;line-height:1.2}
  .uemail{font-size:11.5px;color:var(--muted);margin-top:2px}
  .role{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600}
  .role .rd{width:6px;height:6px;border-radius:99px}
  .role-owner{background:#3a1818;color:#fff}
  .role-owner .rd{background:var(--brand)}
  .role-admin{background:var(--brand-tint);color:var(--brand)}
  .role-admin .rd{background:var(--brand)}
  .role-fleet{background:var(--info-tint);color:var(--info)}
  .role-fleet .rd{background:var(--info)}
  .role-disp{background:#fff3e6;color:#b56b00}
  .role-disp .rd{background:#b56b00}
  .role-view{background:var(--field-bg);color:var(--ink-2);border:1px solid var(--line)}
  .role-view .rd{background:var(--muted)}
  .last{font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
  .last small{display:block;color:var(--muted);font-size:11px;margin-top:2px}

  /* ============ A — BLOCKING MODAL ============ */
  .shade{position:absolute;inset:0;background:rgba(15,18,22,.42);backdrop-filter:blur(3px);display:grid;place-items:center;padding:40px 20px;z-index:10}
  .limit-modal{background:var(--canvas);border-radius:16px;width:520px;max-width:100%;box-shadow:0 24px 60px rgba(0,0,0,.22);position:relative;overflow:hidden}
  .modal-x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:99px;display:grid;place-items:center;color:var(--muted);z-index:2}
  .modal-x:hover{background:var(--hover);color:var(--ink)}

  .lm-head{padding:28px 28px 18px;text-align:center;border-bottom:1px solid var(--line-2);position:relative}
  .lm-glyph{width:60px;height:60px;border-radius:16px;background:var(--brand-tint);color:var(--brand);display:grid;place-items:center;margin:0 auto 14px;position:relative}
  .lm-glyph::after{content:"";position:absolute;inset:-6px;border-radius:20px;border:1px solid var(--brand-tint);opacity:.6}
  .lm-glyph svg{width:26px;height:26px}
  .lm-title{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
  .lm-sub{color:var(--muted);font-size:13px;margin:0;line-height:1.5}
  .lm-sub b{color:var(--ink);font-weight:600}

  .lm-meter{padding:18px 28px;background:var(--field-bg);border-bottom:1px solid var(--line-2)}
  .meter-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .meter-head .lhs{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px}
  .meter-head .plan-pill{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:var(--canvas);border:1px solid var(--line);padding:2px 8px;border-radius:99px}
  .meter-head .rhs{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .meter-head .rhs b{color:var(--brand);font-weight:700;font-size:13.5px}
  .meter-bar{height:8px;border-radius:99px;background:var(--canvas);overflow:hidden;border:1px solid var(--line-2);position:relative}
  .meter-bar > i{display:block;height:100%;width:100%;background:repeating-linear-gradient(45deg,var(--brand) 0,var(--brand) 6px,#d62f2f 6px,#d62f2f 12px);border-radius:99px;animation:slide-stripe 1.6s linear infinite}
  @keyframes slide-stripe{0%{background-position:0 0}100%{background-position:24px 0}}
  .meter-dots{display:flex;gap:3px;margin-top:10px}
  .meter-dots .seat{flex:1;height:5px;border-radius:99px;background:var(--brand)}
  .meter-dots .seat.empty{background:var(--line)}

  .lm-options{padding:20px 28px}
  .lm-opt-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);margin-bottom:10px}
  .lm-opt{display:flex;gap:14px;align-items:flex-start;padding:14px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-align:left;width:100%;cursor:pointer;transition:all var(--t-fast);background:var(--canvas)}
  .lm-opt:hover{border-color:var(--ink);background:var(--field-bg)}
  .lm-opt.is-primary{border-color:var(--ink);background:var(--ink);color:#fff}
  .lm-opt.is-primary:hover{background:#2a2d33;border-color:#2a2d33}
  .lm-opt-ico{width:36px;height:36px;border-radius:9px;background:var(--field-bg);color:var(--ink-2);display:grid;place-items:center;flex:0 0 36px}
  .lm-opt.is-primary .lm-opt-ico{background:rgba(255,255,255,.12);color:#fff}
  .lm-opt-body{flex:1;min-width:0}
  .lm-opt-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
  .lm-opt-name .price{margin-left:auto;font-size:12px;font-weight:600;opacity:.85}
  .lm-opt-name .price small{opacity:.75;font-weight:500}
  .lm-opt-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
  .lm-opt.is-primary .lm-opt-desc{color:rgba(255,255,255,.7)}
  .lm-opt-arrow{align-self:center;color:var(--muted-2)}
  .lm-opt.is-primary .lm-opt-arrow{color:rgba(255,255,255,.7)}

  .lm-foot{padding:14px 28px 20px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:center;border-top:1px solid var(--line-2)}
  .lm-foot a{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:2px}

  /* ============ B — INLINE BANNER STATE ============ */
  .seat-banner{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 18px;border:1px solid color-mix(in srgb,var(--brand) 24%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 5%,var(--canvas)),var(--canvas));border-radius:12px;margin-bottom:16px}
  .sb-ico{width:42px;height:42px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;position:relative;flex-shrink:0}
  .sb-ico::after{content:"";position:absolute;inset:-3px;border-radius:14px;border:1px solid var(--brand-tint);opacity:.7}
  .sb-body{min-width:0}
  .sb-eye{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin-bottom:3px}
  .sb-title{font-size:14.5px;font-weight:700;letter-spacing:-.005em;margin:0 0 3px}
  .sb-desc{font-size:12.5px;color:var(--muted);margin:0;line-height:1.5}
  .sb-desc b{color:var(--ink);font-weight:600}
  .sb-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
  .sb-meter{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-right:4px}
  .sb-meter b{color:var(--brand);font-size:14px;font-weight:700;letter-spacing:-.01em}
  .sb-meter b small{color:var(--muted);font-weight:500;font-size:11px;margin-left:1px}
  .sb-meter .bar{width:120px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
  .sb-meter .bar i{display:block;height:100%;width:100%;background:var(--brand)}

  /* Invite button disabled in this state */
  .btn-locked{position:relative;background:var(--field-bg);color:var(--muted);border-color:var(--line);cursor:not-allowed}
  .btn-locked:hover{background:var(--field-bg)}
  .btn-locked .lk-pad{width:14px;height:14px;display:inline-grid;place-items:center;color:var(--muted)}

  /* Tooltip near the locked invite button */
  .lock-tip{position:absolute;top:calc(100% + 8px);right:0;background:var(--ink);color:var(--canvas);padding:10px 12px;border-radius:8px;font-size:11.5px;font-weight:500;line-height:1.45;width:240px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5;text-align:left}
  .lock-tip::before{content:"";position:absolute;top:-5px;right:24px;width:10px;height:10px;background:var(--ink);transform:rotate(45deg)}
  .lock-tip b{color:#fff}
  .lock-tip a{color:#fff;text-decoration:underline;font-weight:600;display:inline-flex;align-items:center;gap:3px}

  /* Greyed row to suggest the user can remove a member */
  .row-suggest{position:relative}
  .row-suggest::after{content:"Remove to free a seat";position:absolute;top:50%;right:18px;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--brand);background:var(--brand-tint);padding:4px 10px;border-radius:99px;opacity:0;transition:opacity var(--t-fast)}
  .row-suggest:hover::after{opacity:1}

  /* ============ C — FULL PLAN-UPGRADE TAKEOVER ============ */
  .takeover{display:grid;grid-template-columns:480px 1fr;gap:32px;padding:40px 32px;background:linear-gradient(180deg,var(--field-bg),var(--canvas) 70%);min-height:calc(100% - 56px)}
  .to-left{padding-top:30px}
  .to-eye{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);background:var(--brand-tint);padding:5px 10px;border-radius:99px;margin-bottom:18px}
  .to-eye .pulse{width:6px;height:6px;border-radius:99px;background:var(--brand);position:relative}
  .to-eye .pulse::after{content:"";position:absolute;inset:-2px;border-radius:99px;background:var(--brand);opacity:.35;animation:pulse-ring 1.6s ease-out infinite}
  @keyframes pulse-ring{0%{transform:scale(1);opacity:.4}100%{transform:scale(2.5);opacity:0}}
  .to-h1{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 14px}
  .to-h1 .accent{color:var(--brand)}
  .to-lede{font-size:14.5px;color:var(--ink-2);line-height:1.55;margin:0 0 24px;max-width:420px}
  .to-lede b{color:var(--ink);font-weight:600}

  .to-meter{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--canvas);margin-bottom:22px}
  .to-meter-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .to-meter-head .lbl{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .to-meter-head .val{font-size:13px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
  .seat-grid{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}
  .seat-grid .seat{aspect-ratio:1;border-radius:4px;background:var(--brand)}
  .seat-grid .seat.empty{background:var(--line)}
  .to-meter-foot{font-size:11.5px;color:var(--muted);margin-top:10px;display:flex;align-items:center;gap:6px}
  .to-meter-foot svg{color:var(--brand);flex-shrink:0}

  .to-cta-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .to-cta-row .ghost-link{color:var(--ink-2);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;padding:0 6px;height:42px}
  .to-cta-row .ghost-link:hover{color:var(--ink)}

  .to-trust{margin-top:24px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .to-trust .item{display:inline-flex;align-items:center;gap:5px}
  .to-trust svg{color:var(--ok)}

  /* Plan cards */
  .plans{display:flex;flex-direction:column;gap:12px;padding-top:8px}
  .plan{border:1px solid var(--line);border-radius:14px;background:var(--canvas);padding:20px 22px;position:relative;transition:all var(--t-fast)}
  .plan.is-current{background:var(--field-bg);border-style:dashed}
  .plan.is-rec{border-color:var(--ink);box-shadow:0 12px 32px rgba(15,18,22,.08)}
  .plan.is-rec::before{content:"Recommended";position:absolute;top:-10px;left:22px;background:var(--brand);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px}
  .plan-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:10px}
  .plan-meta{min-width:0;flex:1}
